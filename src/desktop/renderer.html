<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';">
  <title>Codex Background Lite</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="rail">
      <div>
        <p class="eyebrow">Codex Background Lite</p>
        <h1>Codex 背景控制器</h1>
        <p class="summary">选择图片，调整视觉参数，然后把背景应用到当前 Codex Desktop 窗口。</p>
      </div>

      <div class="connection" id="connectionBox">
        <div class="status-dot" id="statusDot"></div>
        <div>
          <strong id="statusText">未检测</strong>
          <span id="statusDetail">点击状态检查连接 CDP。</span>
        </div>
      </div>

      <div class="rail-actions">
        <button class="action primary" id="applyBtn" type="button">
          <span class="mark">A</span>
          <span>应用到 Codex</span>
        </button>
        <button class="action" id="statusBtn" type="button">
          <span class="mark">S</span>
          <span>状态检查</span>
        </button>
        <button class="action danger" id="clearBtn" type="button">
          <span class="mark">C</span>
          <span>清除背景</span>
        </button>
      </div>
    </aside>

    <section class="workspace">
      <div class="topbar">
        <div>
          <h2>设置</h2>
          <p id="configPath">正在读取配置...</p>
        </div>
        <button class="ghost" id="openConfigBtn" type="button">打开配置位置</button>
      </div>

      <div class="layout">
        <section class="panel settings-panel" aria-label="背景设置">
          <div class="panel-head">
            <h3>图片</h3>
            <span id="imageMeta">未选择图片</span>
          </div>

          <button class="drop-zone" id="chooseImageBtn" type="button">
            <span class="drop-icon">IMG</span>
            <strong>选择 PNG / JPEG / WebP</strong>
            <small>图片会复制到本机配置目录，重启后可继续使用。</small>
          </button>

          <div class="form-grid">
            <label>
              <span>CDP 端口</span>
              <input id="cdpPort" type="number" min="1" max="65535" step="1">
            </label>
            <label>
              <span>强调色</span>
              <input id="accent" type="color">
            </label>
          </div>

          <label>
            <span>背景遮罩</span>
            <div class="range-line">
              <input id="overlay" type="range" min="0" max="0.9" step="0.01">
              <input id="overlayValue" type="number" min="0" max="0.9" step="0.01">
            </div>
          </label>

          <label>
            <span>面板透明度</span>
            <div class="range-line">
              <input id="panelOpacity" type="range" min="0.05" max="0.95" step="0.01">
              <input id="panelOpacityValue" type="number" min="0.05" max="0.95" step="0.01">
            </div>
          </label>

          <label>
            <span>面板模糊</span>
            <div class="range-line">
              <input id="blur" type="range" min="0" max="32" step="1">
              <input id="blurValue" type="number" min="0" max="32" step="1">
            </div>
          </label>

          <div class="form-grid">
            <label>
              <span>适配方式</span>
              <select id="fit">
                <option value="cover">cover</option>
                <option value="contain">contain</option>
                <option value="auto">auto</option>
              </select>
            </label>
            <label>
              <span>图片位置</span>
              <input id="position" type="text" placeholder="center top">
            </label>
          </div>

          <div class="button-row">
            <button id="saveBtn" type="button">保存设置</button>
            <button id="restartBtn" class="warn" type="button">启动/重启 Codex</button>
          </div>
        </section>

        <section class="panel preview-panel" aria-label="预览和日志">
          <div class="preview" id="preview">
            <div class="mock-shell">
              <div class="mock-side">
                <i></i><i></i><i></i><i></i>
              </div>
              <div class="mock-main">
                <div class="mock-line wide"></div>
                <div class="mock-line"></div>
                <div class="mock-line short"></div>
                <div class="mock-composer"></div>
              </div>
            </div>
          </div>

          <div class="notice">
            <strong>当前模式</strong>
            <span>应用只修改正在运行的 Codex 渲染器。Codex 完全退出或电脑重启后，重新打开此应用再点一次“应用到 Codex”。</span>
          </div>

          <div class="log-wrap">
            <div class="log-head">
              <h3>运行日志</h3>
              <button class="ghost small" id="copyLogBtn" type="button">复制</button>
            </div>
            <pre id="log">就绪。</pre>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="./renderer.js"></script>
</body>
</html>
